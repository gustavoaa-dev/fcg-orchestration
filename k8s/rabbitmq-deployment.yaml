apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  labels:
    app: rabbitmq
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  replicas: 1
  # O PVC e ReadWriteOnce: num rolling update o pod novo ficaria preso esperando o volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "guest"
            - name: RABBITMQ_DEFAULT_PASS
              value: "guest"
            # Sem isto o nome do no e derivado do nome do POD (rabbit@rabbitmq-<hash>-<id>): ao recriar
            # o pod o broker inicia um no novo e "perde" as definicoes, mesmo com o volume intacto
            # (o mnesia fica em /var/lib/rabbitmq/mnesia/rabbit@<nome-do-no>). Nome fixo mantem o
            # diretorio estavel entre recriacoes. No unico com distribuicao em loopback: os clientes
            # falam AMQP pelo Service, nao pelo nome de no.
            - name: RABBITMQ_NODENAME
              value: "rabbit@localhost"
          # Estado do broker em volume: o RABBITMQ_MNESIA_BASE e /var/lib/rabbitmq/mnesia (nao
          # /var/lib/rabbitmq) e o diretorio do no fica logo abaixo da base, em
          # /var/lib/rabbitmq/mnesia/rabbit@<nome-do-no> -- por isso o volume monta /var/lib/rabbitmq
          # inteiro e o nome do no e fixado em rabbit@localhost (acima).
          # Sem fsGroup de proposito -- o entrypoint inicia como root, faz o chown do diretorio para
          # o usuario rabbitmq e so entao desce privilegio com gosu.
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels:
    app: rabbitmq
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
