apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlserver-data
  labels:
    app: sqlserver
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  labels:
    app: sqlserver
spec:
  replicas: 1
  # O PVC e ReadWriteOnce: num rolling update o pod novo ficaria preso esperando o volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      # A imagem do mssql roda como uid 10001: sem fsGroup o volume novo vem root e o SQL Server nao sobe.
      securityContext:
        fsGroup: 10001
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          resources:
            limits:
              memory: "2Gi"
              cpu: "1000m"
            requests:
              memory: "2Gi"
              cpu: "500m"
          env:
            - name: ACCEPT_EULA
              value: "Y"
            # A imagem do SQL Server dimensiona o consumo pela memoria do NO, nao pelo cgroup:
            # com limite de 1Gi ele tentava alocar alem do limite e abortava (exit 235, "unable to
            # allocate MsqlXactManager" / Error 17300). O limite interno abaixo faz o SQL Server
            # respeitar o cgroup, e o limite do container subiu para o minimo recomendado (2 GB).
            - name: MSSQL_MEMORY_LIMIT_MB
              value: "1536"
            # A senha vem do Secret `sqlserver-secret` (chave `sa-password`), criado por
            # `kubectl create secret` ANTES do apply -- ver a secao "Segredos" do README.
            - name: SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sqlserver-secret
                  key: sa-password
          # Estado do banco (usuarios, jogos e biblioteca) mora em volume: o filesystem do
          # container e descartado sempre que o pod e recriado.
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sqlserver-data
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver
  labels:
    app: sqlserver
spec:
  type: ClusterIP
  selector:
    app: sqlserver
  ports:
    - port: 1433
      targetPort: 1433
